name: matfile-dev

# Entwicklung: Container neu bauen und Stack neu deployen
#   docker compose -f docker-compose.dev.yml up -d --build

services:
  matfile:
    image: matfile:dev
    container_name: matfile-dev
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        MATFILE_VERSION: ${MATFILE_VERSION:-}
        INSTALL_MOUNT_TOOLS: "true"
        INSTALL_FFMPEG: "false"
    restart: unless-stopped
    ports:
      - "2222:2222"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: "2222"
      MATFILE_DATA: /data
      TZ: Europe/Berlin
      Logging__LogLevel__Default: Debug
    volumes:
      - matfile-dev-data:/data
      # Testdaten für den Explorer:
      - ./sample-data:/storage/sample

  # Test-Gegenstelle fuer die Remote-Provider.
  # Start nur bei Bedarf: docker compose -f docker-compose.dev.yml --profile testing up -d
  sftp:
    image: atmoz/sftp:alpine
    container_name: matfile-sftp
    profiles: ["testing"]
    command: matfile:Sftp-Geheim-2026:1001:::upload
    restart: unless-stopped

  ftp:
    image: delfer/alpine-ftp-server
    container_name: matfile-ftp
    profiles: ["testing"]
    environment:
      USERS: "matfile|Ftp-Geheim-2026|/ftp/matfile"
      ADDRESS: ftp
    restart: unless-stopped

  webdav:
    image: bytemark/webdav
    container_name: matfile-webdav
    profiles: ["testing"]
    environment:
      AUTH_TYPE: Basic
      USERNAME: matfile
      PASSWORD: Dav-Geheim-2026
    restart: unless-stopped

volumes:
  matfile-dev-data:
